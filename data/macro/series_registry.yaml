# QUANTGEN v2.0 series registry (M1; R-19 rules 1 and 5; spec section 4.2; rulings section 2).
# Shipped, read-only. Loaded by core/ficc/contracts.py:load_registry, which refuses: an acting binding without a
# contract, an acting/forward_sim binding without a `books` key (`books: []` = dormant, allowed), a group name used as
# a series id, a group or range-group member that does not exist, and a binding that differs from the rules store's
# `data_contracts.roles` entry (the store governs; this file must be a literal copy).
# Bare book kinds (`recommended`, `specification`) mean that kind's book in the series' market (L1105).
version: "2.0.0"
read_only: true

# Publication schedules (schedule_id -> rule; time/tz are the published instant; "calendar" names the holiday set).
schedules:
  KRX_CLOSE:    {calendar: KRX,   rule: close_print_bound,            market: KR}
  NYSE_CLOSE:   {calendar: NYSE,  rule: close_print_bound,            market: US}
  JP_CLOSE:     {calendar: JPX,   rule: close_print_bound,            market: JP}
  CN_CLOSE:     {calendar: SSE,   rule: close_print_bound,            market: CN}
  HK_CLOSE:     {calendar: HKEX,  rule: close_print_bound,            market: HK}
  TW_CLOSE:     {calendar: TWSE,  rule: close_print_bound,            market: TW}
  FRED_H15:     {calendar: FED,   rule: next_fed_business_day_after_obs, time: "16:15", tz: America/New_York}
  H10:          {calendar: FED,   rule: monday_after_week_else_next_fed_business_day, time: "16:15", tz: America/New_York}
  TREASURY_PAR: {calendar: SIFMA, rule: on_obs_date_logged_posting_time, time: "18:00", tz: America/New_York}
  VIXCLS:       {calendar: CBOE,  rule: on_obs_date,                  time: "16:15", tz: America/New_York}
  BLS:          {calendar: BLS,   rule: release_calendar,             time: "08:30", tz: America/New_York}
  BEA:          {calendar: BEA,   rule: release_calendar,             time: "08:30", tz: America/New_York}
  ECOS_1530:    {calendar: ECOS,  rule: on_obs_date_value_proxy,      time: "15:30", tz: Asia/Seoul, close_1500_until: "2016-08-01"}
  KODEX_PDF:    {calendar: KRX,   rule: next_krx_session,             time: "08:00", tz: Asia/Seoul}
  LIVE_QUOTE:   {calendar: venue, rule: quote_stamp_le_decision}
  AS_POSTED:    {calendar: source, rule: first_seen_retrieval}
  DERIVED:      {calendar: inputs, rule: latest_input_available_at}

# Consumer -> kind (F-10). A consumer not listed here is not a context consumer: pit_value raises for it.
consumers:
  R-03: acting_exposure
  R-04: acting_exposure
  R-06: acting_exposure
  R-07: acting_exposure
  R-25: acting_exposure
  nav: acting_exposure
  R-28_R-29: forward_sim
  nav_fx: forward_sim
  nav_fx_backtests: forward_sim
  corr63: risk_model
  corr63_backtests: risk_model
  korea_covariance: risk_model
  hedge_state: risk_model
  R-08: context
  R-11_refusal_book: context
  R-12_refusal_book: context
  R-13: context
  R-16: context
  context_log: context
  display: context
  R-22: history
  card_harness: history

# Primary official-close channels and whether the close field is verified (F-4: the KIS field is UNVERIFIED until the
# M1-01 quote-field check is recorded; KIS daily rows are stamped vendor_close until a signed revision flips this).
primary_sources:
  KRX: verified
  KIS: unverified

groups:
  ASIA_INDEX_CLOSES: [NIKKEI225_CLOSE, SHANGHAI_CLOSE, HSI_CLOSE, TAIEX_CLOSE]
  KRX_MARKET_CAPS_005930_000660_KOSPI: [KRX_005930_MARKET_CAP, KRX_000660_MARKET_CAP, KOSPI_TOTAL_MARKET_CAP]
  NON_KR_INDEX_MONTH_END_CLOSES: [SPX_MONTH_END_CLOSE, NIKKEI225_MONTH_END_CLOSE, HSI_MONTH_END_CLOSE, DAX_MONTH_END_CLOSE,
                                  FTSE100_MONTH_END_CLOSE, TAIEX_MONTH_END_CLOSE]
  NAV_LINE_CLOSES: [KRX_069500_OFFICIAL_CLOSE]

range_groups:
  US_TREASURY: {unit: pct, range: [-1, 20], members: [DGS10, DGS2, DGS30, DTB3, UST_PAR_10Y, T10Y3M, T10Y2Y]}
  KR_CALL_CD:  {unit: pct, range: [-1, 40], members: [BOK_CALL_RATE, KR_CD91]}

# Group-level bindings (verbatim from data_contracts.roles; apply to every member).
group_bindings:
  ASIA_INDEX_CLOSES: [{role: risk_model, consumer: korea_covariance, action: risk_model_covariance}]
  KRX_MARKET_CAPS_005930_000660_KOSPI: [{role: acting_exposure, books: [recommended, specification]}]
  NON_KR_INDEX_MONTH_END_CLOSES: [{role: forward_sim, books: ["forward_sim:R-28"]}]
  NAV_LINE_CLOSES: [{role: acting_exposure, consumer: nav, books: [recommended, specification], halt_after_consecutive_decisions: 3},
                    {role: forward_sim, consumer: nav, books: ["forward_sim:R-28", "forward_sim:R-29"]}]

defaults: &defaults
  grace_publication_bdays: 1
  release_event_type: null
  adjustment_basis: null
  bindings: []
  contract: {dtype: float, decimals: 4}

_krx_close: &krx_close
  <<: *defaults
  source: KRX
  sources: [KRX, KIS, Yahoo]
  frequency: daily
  obs_calendar: KRX
  market: KR
  schedule: KRX_CLOSE
  publication_schedule: {calendar: KRX, time: close_print_bound, tz: Asia/Seoul}
  obs_date_tz: Asia/Seoul
  timing_class: live
  production_channel: "KRX marketplace / KIS"
  history_channel: "KRX official closes"
  obs_kind: close
  unit: index_points
  tolerance: {index_bp: 1}
  contract: {dtype: float, unit: index_points, decimals: 2}

_nyse_close: &nyse_close
  <<: *defaults
  source: KIS
  sources: [KIS, FMP, Yahoo]
  frequency: daily
  obs_calendar: NYSE
  market: US
  schedule: NYSE_CLOSE
  publication_schedule: {calendar: NYSE, time: close_print_bound, tz: America/New_York}
  obs_date_tz: America/New_York
  timing_class: live
  production_channel: "KIS quotes"
  history_channel: "FMP EOD; Yahoo secondary"
  obs_kind: close
  unit: index_points
  tolerance: {index_bp: 1}
  contract: {dtype: float, unit: index_points, decimals: 2}

_fred_h15: &fred_h15
  <<: *defaults
  source: FRED
  sources: [FRED]
  channel: "H.15"
  frequency: daily
  obs_calendar: FED
  market: US
  schedule: FRED_H15
  publication_schedule: {calendar: FED, time: "16:15", tz: America/New_York}
  obs_date_tz: America/New_York
  timing_class: publication
  production_channel: FRED
  history_channel: FRED
  obs_kind: release
  unit: pct
  contract: {dtype: float, unit: pct, decimals: 2}

_fred_h10: &fred_h10
  <<: *defaults
  source: FRED
  sources: [FRED]
  channel: "H.10"
  frequency: daily
  obs_calendar: FED
  market: US
  schedule: H10
  publication_schedule: {calendar: FED, time: "16:15", tz: America/New_York}
  obs_date_tz: America/New_York
  timing_class: publication
  production_channel: FRED
  history_channel: FRED
  obs_kind: release
  unit: level
  contract: {dtype: float, unit: level, decimals: 4}

_fred_monthly: &fred_monthly
  <<: *defaults
  source: FRED
  sources: [ALFRED, FRED]
  channel: "FRED + ALFRED vintages (output_type=4 first release)"
  frequency: monthly
  obs_calendar: BLS
  market: US
  schedule: BLS
  publication_schedule: {calendar: BLS, time: "08:30", tz: America/New_York}
  release_event_type: BLS_RELEASE
  obs_date_tz: America/New_York
  timing_class: publication
  production_channel: FRED
  history_channel: ALFRED
  obs_kind: release
  unit: index
  monthly_index: first_day_of_reference_month
  contract: {dtype: float, unit: index, decimals: 3}

_as_posted: &as_posted
  <<: *defaults
  source: FRED
  sources: [FRED]
  frequency: daily
  obs_calendar: FED
  market: US
  schedule: AS_POSTED
  publication_schedule: {calendar: source, time: first_seen, tz: UTC}
  obs_date_tz: America/New_York
  timing_class: publication
  production_channel: FRED
  history_channel: FRED
  obs_kind: release
  unit: level

series:
  # ---------------------------------------------------------------- Korea (L1405-1418)
  KOSPI_OFFICIAL_CLOSE:
    <<: *krx_close
    channel: "KRX idx/krx_dd_trd CLSPRC_IDX; KIS U/0001 bstp_nmix_prpr (UNVERIFIED)"
    abs_daily_return_max: 0.30
    bindings: [{role: acting_exposure, books: [specification]}]   # + recommended while verdict_filter admits R-06 KR
  KOSPI200_OFFICIAL_CLOSE:
    <<: *krx_close
    channel: "KRX idx/krx_dd_trd; KIS U/2001 (UNVERIFIED)"
    abs_daily_return_max: 0.30
  KRX_005930_OFFICIAL_CLOSE:
    <<: *krx_close
    unit: KRW
    adjustment_basis: raw_official_close_plus_effective_dated_corporate_action_factors
    tolerance: {stock: exact}
    contract: {dtype: float, unit: KRW, decimals: 0}
  KRX_000660_OFFICIAL_CLOSE:
    <<: *krx_close
    unit: KRW
    adjustment_basis: raw_official_close_plus_effective_dated_corporate_action_factors
    tolerance: {stock: exact}
    contract: {dtype: float, unit: KRW, decimals: 0}
  KRX_069500_OFFICIAL_CLOSE:
    <<: *krx_close
    unit: KRW
    adjustment_basis: raw_official_close_plus_effective_dated_corporate_action_factors
    tolerance: {stock: exact}
    contract: {dtype: float, unit: KRW, decimals: 0}
  KRX_005930_MARKET_CAP:
    <<: *krx_close
