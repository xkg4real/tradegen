    sources: [KIS]
    frequency: daily
    obs_calendar: KRX
    market: KR
    schedule: AS_POSTED
    publication_schedule: {calendar: KRX, time: after_close, tz: Asia/Seoul}
    obs_date_tz: Asia/Seoul
