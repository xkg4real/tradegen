[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradegen"
version = "2.0.0"
description = "TRADEGEN — personal trading program with guarded execution and market data"
requires-python = ">=3.13"
dependencies = [
  "flet[all]==0.85.2",
  "pyyaml>=6.0",
  "requests>=2.31",
  "websockets==16.0",
  "python-dotenv>=1.0", "tzdata>=2024.1; sys_platform == 'win32'",
  "numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "matplotlib>=3.8", "gs-quant>=1.0",
  "yfinance>=0.2", "pandas-datareader>=0.10",
  "cryptography==49.0.0",
]

[tool.setuptools]
py-modules = ["main", "config"]

[tool.setuptools.packages.find]
include = ["core*", "data*", "ui*", "execution*"]
exclude = ["_legacy*", "tests*", "qa*"]

[tool.flet]
app = { module = "main", path = "." }

[tool.flet.icon]
default = "assets/icon.png"
windows = "assets/icon.ico"
web = "assets/icon_192.png"
