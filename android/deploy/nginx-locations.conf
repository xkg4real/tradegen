# Include inside the operator's dedicated HTTPS server block. Set its root to
# the extracted site/ directory. Keep all subscriber and relay files elsewhere.
location = /android { return 308 /android/; }
location = /android/ {
    default_type text/html;
    charset utf-8;
    add_header Cache-Control 'no-store' always;
    try_files /android/index.html =404;
}
location ~ ^/android/(app\.mjs|subscription\.mjs|sw\.js|style\.css|manifest\.webmanifest|icon-(192|512)\.png|push-config\.json)$ {
    types {
        text/javascript js mjs;
        text/css css;
        image/png png;
        application/manifest+json webmanifest;
        application/json json;
    }
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control 'no-cache' always;
    try_files $uri =404;
}
location = /approvals/ {
    error_page 503 =503 /approval-offline.html;
    return 503;
}
location = /approval-offline.html {
    internal;
    default_type text/html;
    charset utf-8;
    add_header Cache-Control 'no-store' always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
}
location / { return 404; }
