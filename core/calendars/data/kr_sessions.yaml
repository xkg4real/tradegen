  from: '1995-01-01'
  to: '2027-12-31'
coverage_calendar: KRX
signed_off_by: null
signed_utc: null
md5: null
how_to_sign: verify every row against its official source, fill source_url and signed_off_by on every row, set signed_off_by
  / signed_utc at file level, set md5 to the content md5 printed by `python -m core.calendars.store`, and add the matching
  MANIFEST.yaml row with a new test id
unverified:
- CSAT dates
- regular open eras
- lunch-break last date
- pre-2016 CSAT window (config placeholder 10:00-16:00 governs until a signed csat_window row exists)
owner_must_sign:
- 'saturday_close rows (saturday_session_close_kst, from_krx_notice): without them decision_time_utc on a pre-1998-12-12 Saturday
  raises CalendarUnsigned (never the weekday close)'
- random_end_extension rows for sessions before 2015-06-15 whose conditional random end was triggered
- csat_window / csat_closing_call rows for CSAT days before 2016-08-01
- the CSAT date list
notes: 'row kinds: csat_day{date}; saturday_close{close_kst}; random_end_extension{session_date, extension_s}; lunch_break{window_kst};
  regular_open{open_kst}; csat_window{window_kst}; csat_closing_call{window_kst}'
