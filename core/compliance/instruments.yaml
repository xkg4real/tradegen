# TRADEGEN instrument map (spec 5.1; plan decisions P9, P10, P11). DRAFT: only the bytes the owner signs as
# `approved {kind: instruments}` are in force.
# `class` is declared and must equal the class rules.py derives from asset, multiple and underlying.
# `source` is an issuer or exchange page found in the repo research, or the UNVERIFIED marker.
# KRX codes are quoted: the strict loader keeps 005930 a string only when it is quoted.
# Coins: `currency` is KRW, the unit TRADEGEN values every holding in; each venue market's quote is in
# core/odds/venues.yaml.
schema: tradegen.instruments/1
krx:
  "005930":                      # Samsung Electronics common share
    asset: krx_share
    multiple: 1.0
    underlying: null
    class: share
    cost_book: KRX_stock_book
    currency: KRW
    tax_basis: krx_small_holder_exempt
    source: "UNVERIFIED: owner to confirm before approval"
  "069500":                      # KODEX 200
    asset: krx_etp
    multiple: 1.0
    underlying: index
    class: etp_1x
    cost_book: KRX_ETF_line
    currency: KRW
    tax_basis: krx_small_holder_exempt
    source: "UNVERIFIED: owner to confirm before approval"
  "252670":                      # KODEX 200 Futures Inverse 2X
    asset: krx_etp
    multiple: -2.0
    underlying: index
    class: etp_leveraged
    cost_book: KRX_ETF_line
    currency: KRW
    tax_basis: unsupported         # futures-based leveraged ETF: tax treatment unverified
    source: "https://www.samsungfund.com/etf/product/view.do?id=2ETF70"
  "114800":                      # KODEX Inverse
    asset: krx_etp
    multiple: -1.0
    underlying: index
    class: etp_index_inverse
    cost_book: KRX_ETF_line
    currency: KRW
    tax_basis: unsupported         # futures-based inverse ETF: tax treatment unverified
    source: "UNVERIFIED: owner to confirm before approval"
